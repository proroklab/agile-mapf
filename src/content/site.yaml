sections:
  abstract:
    id: "overview"
    title: "Abstract"
    body: |
      Coordinated trajectory planning is essential for multi-robot applications, ranging from factory automation to entertainment.
      The main challenge is providing long-term coordination guarantees, such as freedom from collisions, deadlocks, and livelocks, as well as kinodynamic agility, especially in densely populated environments.
      Although continuous optimization provides agility, it is computationally expensive.
      In contrast, discrete search is scalable but lacks physical realism for robot execution.
      This study introduces _concrete_ planning, a hybrid approach that captures real-world *con*tinuous dynamics while maintaining scalable guaranteed planning via dis*crete* search.
      We integrate recent advances in robot dynamics learning, optimal control, and anytime complete planning into a modular framework.
      The framework is deployed with 40 robots, including 20 aerial, 8 ground, and 12 obstacle robots, operating in a compact laboratory space.
      Despite the dense and time-varying setup, the robots achieve consecutive navigation missions on-demand, while executing aggressive maneuvers that substantially reduce task completion time.

