name: CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - README.md
      - LICENSE
      - CITATION.cff
      - AGENTS.md
      - SECURITY.md
      - SUPPORT.md
      - visualizer/README.md
      - .github/ISSUE_TEMPLATE/**

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize required submodules
        run: git submodule update --init --recursive third_party/argparse third_party/cnpy

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libeigen3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install yaml-cpp eigen

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure
